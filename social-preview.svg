<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#grad)" rx="20"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1180" cy="620" r="300" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Main content -->
  <text x="640" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="80" fill="white" text-anchor="middle" font-weight="bold">📚</text>
  
  <text x="640" y="280" font-family="Segoe UI, Arial, sans-serif" font-size="56" fill="white" text-anchor="middle" font-weight="bold">GATE CSE PYQ &amp; Notes</text>
  
  <text x="640" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)" text-anchor="middle">Previous Year Questions (2007-2026) + DBMS Lecture Notes</text>
  
  <!-- Stats boxes -->
  <rect x="240" y="420" width="200" height="120" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="340" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">24</text>
  <text x="340" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)" text-anchor="middle">PYQ Papers</text>
  
  <rect x="540" y="420" width="200" height="120" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="640" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">77</text>
  <text x="640" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)" text-anchor="middle">DBMS Lectures</text>
  
  <rect x="840" y="420" width="200" height="120" rx="15" fill="rgba(255,255,255,0.2)"/>
  <text x="940" y="475" font-family="Segoe UI, Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" font-weight="bold">20</text>
  <text x="940" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)" text-anchor="middle">Years</text>
  
  <!-- Badge -->
  <rect x="1000" y="640" width="200" height="40" rx="20" fill="rgba(255,255,255,0.2)"/>
  <text x="1100" y="665" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">⭐ MIT License</text>
  
  <!-- GitHub username -->
  <text x="80" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.7)">github.com/Asishranjansahu</text>
</svg>
